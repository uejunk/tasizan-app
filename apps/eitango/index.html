<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>えいたんご</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
    <!-- Common shared modules -->
    <script src="../../shared/common.js"></script>

    <style>
        * {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            background: linear-gradient(135deg, #d1fae5 0%, #fef3c7 100%);
            min-height: 100vh;
            min-height: 100dvh;
        }
        .app-screen {
            height: 100vh;
            height: 100dvh;
        }
        .btn-choice {
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15);
        }
        .btn-choice:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.08); }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .shake {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body class="app-screen flex flex-col h-screen overflow-hidden text-slate-800">

    <!-- Header -->
    <header class="w-full bg-white/80 backdrop-blur-md border-b border-emerald-100 px-4 py-2 flex justify-between items-center z-10 shrink-0 shadow-sm">
        <a href="../../index.html" class="flex items-center space-x-2">
            <i class="fa-solid fa-arrow-left text-emerald-600 text-lg"></i>
            <span class="font-extrabold text-lg text-emerald-600 tracking-wide">えいたんご</span>
        </a>
        <div class="bg-amber-100 border border-amber-300 px-3 py-1 rounded-full flex items-center space-x-1">
            <i class="fa-solid fa-star text-amber-500 text-sm"></i>
            <span id="star-count" class="font-black text-amber-700 text-sm">0</span>
        </div>
    </header>

    <!-- Main -->
    <main class="flex-1 relative overflow-hidden flex flex-col">
        <div id="quiz-view" class="absolute inset-0 flex flex-col justify-between p-4 max-w-md mx-auto w-full">

            <!-- Progress -->
            <div class="w-full bg-white/90 rounded-2xl p-3 shadow-md border border-emerald-100">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-xs font-bold text-emerald-600"><i class="fa-solid fa-flag-checkered mr-1"></i>もんだい</span>
                    <span id="question-progress-text" class="text-xs font-black text-emerald-800">1 / 10 問め</span>
                </div>
                <div class="w-full bg-slate-100 h-3.5 rounded-full overflow-hidden p-0.5 border border-slate-200">
                    <div id="progress-bar" class="bg-gradient-to-r from-emerald-400 to-teal-500 h-full rounded-full transition-all duration-300" style="width: 10%;"></div>
                </div>
            </div>

            <!-- Question Card -->
            <div id="problem-card" class="bg-white rounded-3xl p-6 shadow-xl border-2 border-emerald-200 my-auto text-center pop-in">
                <p class="text-sm font-bold text-emerald-600 mb-2">これを えいごで なんていう？</p>
                <div class="text-6xl font-black text-slate-800 my-4" id="word-ja">りんご</div>
            </div>

            <!-- Choices -->
            <div id="choices" class="grid grid-cols-2 gap-3">
                <!-- Buttons injected via JS -->
            </div>
        </div>
    </main>

    <script>
        const save = new SaveManager('eitango');
        const starCounter = new StarCounter('star-count');

        let gameState = {
            words: [],
            currentWord: null,
            choices: [],
            questionIndex: 1,
            totalQuestions: 10,
            stars: 0
        };

        function loadSaveData() {
            const data = save.load();
            gameState.stars = data.stars || 0;
            starCounter.set(gameState.stars);
        }

        function saveData() {
            save.save({ stars: gameState.stars });
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function generateQuestion() {
            if (gameState.words.length === 0) return;

            // Pick a target word
            const target = gameState.words[Math.floor(Math.random() * gameState.words.length)];
            gameState.currentWord = target;

            // Build 4 choices (1 correct + 3 distractors)
            const distractors = shuffle(gameState.words.filter(w => w.en !== target.en)).slice(0, 3);
            const choices = shuffle([target, ...distractors]);
            gameState.choices = choices;

            // Update UI
            document.getElementById('word-ja').innerText = target.ja;
            const choicesContainer = document.getElementById('choices');
            choicesContainer.innerHTML = '';
            choices.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'btn-choice bg-white hover:bg-emerald-50 text-slate-800 text-xl font-black py-4 rounded-2xl border border-slate-200';
                btn.innerText = c.en;
                btn.onclick = () => selectAnswer(c.en);
                choicesContainer.appendChild(btn);
            });

            // Animate card
            const card = document.getElementById('problem-card');
            card.classList.remove('pop-in', 'shake');
            void card.offsetWidth;
            card.classList.add('pop-in');
        }

        function selectAnswer(selectedEn) {
            if (!gameState.currentWord) return;
            const isCorrect = (selectedEn === gameState.currentWord.en);
            const card = document.getElementById('problem-card');

            if (isCorrect) {
                sound.playCorrect();
                gameState.stars += 1;
                saveData();
                starCounter.update();
                confetti({ particleCount: 25, spread: 60, origin: { y: 0.6 } });

                setTimeout(() => {
                    if (gameState.questionIndex < gameState.totalQuestions) {
                        gameState.questionIndex++;
                        updateProgressBar();
                        generateQuestion();
                    } else {
                        handleRoundCompletion();
                    }
                }, 800);
            } else {
                sound.playWrong();
                card.classList.remove('shake');
                void card.offsetWidth;
                card.classList.add('shake');
            }
        }

        function updateProgressBar() {
            document.getElementById('question-progress-text').innerText = `${gameState.questionIndex} / ${gameState.totalQuestions} 問め`;
            const percent = (gameState.questionIndex / gameState.totalQuestions) * 100;
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

        function handleRoundCompletion() {
            confetti({ particleCount: 100, spread: 80, origin: { y: 0.5 } });
            setTimeout(() => {
                gameState.questionIndex = 1;
                updateProgressBar();
                generateQuestion();
            }, 1000);
        }

        window.onload = async function() {
            loadSaveData();
            try {
                const res = await fetch('../../data/eitango-words.json');
                gameState.words = await res.json();
            } catch (e) {
                document.getElementById('word-ja').innerText = 'データ読み込みエラー';
                return;
            }
            updateProgressBar();
            generateQuestion();
        };
    </script>
</body>
</html>
