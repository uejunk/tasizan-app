<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>べんきょうランド</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            background: linear-gradient(135deg, #e0f2fe 0%, #fef3c7 100%);
            min-height: 100vh;
        }
        .app-card {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .app-card:active {
            transform: scale(0.97);
        }
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            70% { transform: scale(1.03); }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen text-slate-800">

    <!-- Header -->
    <header class="w-full bg-white/80 backdrop-blur-md border-b border-sky-100 px-4 py-3 flex justify-center items-center z-10 shadow-sm">
        <div class="flex items-center space-x-2">
            <span class="text-3xl">🎒</span>
            <h1 class="font-extrabold text-2xl text-sky-600 tracking-wide">べんきょうランド</h1>
        </div>
    </header>

    <!-- Main: App Grid -->
    <main class="flex-1 p-6 max-w-md mx-auto w-full">
        <p class="text-center text-sm font-bold text-slate-600 mb-5">
            <i class="fa-solid fa-hand-pointer mr-1"></i>あそぶ アプリをえらぼう！
        </p>

        <div id="app-grid" class="grid grid-cols-2 gap-4">
            <!-- Cards dynamically injected via JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-4 text-xs text-slate-400 font-bold">
        <i class="fa-solid fa-heart text-rose-300"></i> たのしく べんきょうしよう！
    </footer>

    <script>
        const apps = [
            {
                id: 'tasizan',
                title: 'たしざん ぼうけん',
                description: 'まほうのぼうけんで たしざんをたのしくまなぼう！',
                emoji: '🪄',
                bg: 'from-sky-400 to-indigo-500',
                url: 'apps/tasizan/index.html'
            },
            {
                id: 'eitango',
                title: 'えいたんご',
                description: 'かんたんな えいたんごを ゲームでまなぼう！',
                emoji: '🔤',
                bg: 'from-emerald-400 to-teal-500',
                url: 'apps/eitango/index.html'
            }
        ];

        function renderAppGrid() {
            const grid = document.getElementById('app-grid');
            grid.innerHTML = '';
            apps.forEach(app => {
                const card = document.createElement('a');
                card.href = app.url;
                card.className = `app-card pop-in bg-gradient-to-br ${app.bg} rounded-3xl p-5 shadow-lg border-2 border-white/50 flex flex-col items-center text-white text-center`;
                card.innerHTML = `
                    <div class="text-5xl mb-3 drop-shadow-md">${app.emoji}</div>
                    <h2 class="font-black text-lg mb-1 drop-shadow">${app.title}</h2>
                    <p class="text-xs font-bold text-white/90 leading-relaxed">${app.description}</p>
                    <div class="mt-3 bg-white/30 px-4 py-1.5 rounded-full text-xs font-black flex items-center gap-1">
                        <i class="fa-solid fa-play text-[10px]"></i> はじめる
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        window.onload = renderAppGrid;
    </script>
</body>
</html>
